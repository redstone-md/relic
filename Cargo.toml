[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/redstone-md/relic"
homepage = "https://github.com/redstone-md/relic"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Key generation and password hashing are unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 3

# The launcher draws its scenes on the CPU, every frame.
[profile.dev.package.launcher-client]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
