[package]
name = "admin-core"
description = "Relic daemon: runs Minecraft servers, serves the modpack, accounts and the admin panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
png = "0.18.1"
rand = "0.10.3"
relic-jar = { version = "0.0.1", path = "../relic-jar" }
relic-mc = { version = "0.0.1", path = "../relic-mc" }
relic-proto = { version = "0.0.1", path = "../relic-proto" }
rsa = { version = "0.10", features = ["pkcs1v15"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = "0.36.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tempfile = "3.27.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
